<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Arcadia!</title>
  <link rel="icon" type="image/png" href="arcadiafavicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
    }

    body {
      background-color: #191919;
      background-image: url('background.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Top Logo Container & Styling */
    .brand-logo {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      width: 100%;
      transition: all 0.2s ease;
    }

    /* Extra large size on initial selection screen */
    .brand-logo img {
      width: clamp(280px, 60vw, 550px);
      height: auto;
      display: block;
      transition: width 0.2s ease;
    }

    /* Scaled down size when viewing forms */
    .brand-logo.small img {
      width: clamp(200px, 40vw, 320px);
    }

    /* Selection Screen Layout */
    #selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Scalable "Account" Heading Text */
    .account-text-heading {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Responsive Square Image Buttons (Border Removed) */
    .selection-container {
      display: flex;
      gap: clamp(15px, 3vw, 40px);
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    .square-btn {
      width: clamp(140px, 30vmin, 280px);
      height: clamp(140px, 30vmin, 280px);
      background-color: #232527;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .square-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Responsive Auth Form Card */
    .auth-card {
      background: #232527;
      border: 1px solid #393b3d;
      border-radius: 6px;
      width: 100%;
      max-width: clamp(300px, 90vw, 440px);
      padding: clamp(1.2rem, 4vw, 2.2rem);
    }

    .auth-card h2 {
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-align: center;
      color: #fff;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      font-weight: 600;
      color: #ccc;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 0.75rem 0.8rem;
      background: #111213;
      border: 1px solid #393b3d;
      color: #fff;
      border-radius: 4px;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      outline: none;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .birthday-selects {
      display: flex;
      gap: 0.5rem;
    }

    .btn-roblox {
      width: 100%;
      background: #00a2ff;
      border: none;
      color: #fff;
      padding: 0.8rem;
      font-weight: 700;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-back {
      background: #393b3d;
      margin-top: 0.6rem;
    }

    .error-msg {
      background: rgba(248, 43, 43, 0.15);
      border: 1px solid #f82b2b;
      color: #ff6b6b;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="brand-logo" class="brand-logo">
    <img src="arcadia.png" alt="ARCADIA">
  </div>

  <div id="selection-screen">
    <h1 class="account-text-heading">Account</h1>

    <div class="selection-container">
      <div class="square-btn" onclick="openForm('login')">
        <img src="login.png" alt="Log In">
      </div>
      <div class="square-btn" onclick="openForm('signup')">
        <img src="signup.png" alt="Sign Up">
      </div>
    </div>
  </div>

  <div id="auth-card-container" class="auth-card hidden">
    <div id="error-box" class="error-msg"></div>

    <form id="login-form" class="hidden">
      <h2>Log In to Arcadia</h2>
      
      <div class="form-group">
        <label for="login-username">Username / Email</label>
        <input type="text" id="login-username" placeholder="Username" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('login-password', this)">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-roblox">Log In</button>
      <button type="button" class="btn-roblox btn-back" onclick="showSelectionScreen()">Back</button>
    </form>

    <form id="signup-form" class="hidden">
      <h2>Sign Up for Arcadia</h2>

      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="Don't use your real name" required minlength="3" maxlength="20">
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="signup-password" placeholder="At least 8 characters" required minlength="8">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('signup-password', this)">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label>Birthday</label>
        <div class="birthday-selects">
          <select id="dob-month" required>
            <option value="" disabled selected>Month</option>
            <option>Jan</option><option>Feb</option><option>Mar</option>
            <option>Apr</option><option>May</option><option>Jun</option>
            <option>Jul</option><option>Aug</option><option>Sep</option>
            <option>Oct</option><option>Nov</option><option>Dec</option>
          </select>
          <select id="dob-day" required>
            <option value="" disabled selected>Day</option>
          </select>
          <select id="dob-year" required>
            <option value="" disabled selected>Year</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Gender (Optional)</label>
        <select id="signup-gender">
          <option value="unspecified">Unspecified</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </div>

      <button type="submit" class="btn-roblox">Sign Up</button>
      <button type="button" class="btn-roblox btn-back" onclick="showSelectionScreen()">Back</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const daySelect = document.getElementById("dob-day");
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        daySelect.appendChild(opt);
      }

      const yearSelect = document.getElementById("dob-year");
      const currentYear = new Date().getFullYear();
      for (let i = currentYear; i >= 1920; i--) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        yearSelect.appendChild(opt);
      }
    });

    function openForm(mode) {
      document.getElementById("selection-screen").classList.add("hidden");
      document.getElementById("auth-card-container").classList.remove("hidden");
      document.getElementById("brand-logo").classList.add("small");
      document.getElementById("error-box").style.display = "none";

      if (mode === 'login') {
        document.getElementById("login-form").classList.remove("hidden");
        document.getElementById("signup-form").classList.add("hidden");
      } else {
        document.getElementById("signup-form").classList.remove("hidden");
        document.getElementById("login-form").classList.add("hidden");
      }
    }

    function showSelectionScreen() {
      document.getElementById("auth-card-container").classList.add("hidden");
      document.getElementById("login-form").classList.add("hidden");
      document.getElementById("signup-form").classList.add("hidden");
      document.getElementById("brand-logo").classList.remove("small");
      document.getElementById("selection-screen").classList.remove("hidden");
    }

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btnEl.innerText = "Hide";
      } else {
        input.type = "password";
        btnEl.innerText = "Show";
      }
    }

    function showError(message) {
      const errorBox = document.getElementById("error-box");
      errorBox.innerText = message;
      errorBox.style.display = "block";
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      if (!username || !password) {
        showError("Please enter both username and password.");
        return;
      }

      localStorage.setItem("arcadia_user", JSON.stringify({ username: username }));
      alert(`Logged in successfully as ${username}!`);
    });

    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("signup-username").value.trim();
      const password = document.getElementById("signup-password").value;
      const month = document.getElementById("dob-month").value;
      const day = document.getElementById("dob-day").value;
      const year = document.getElementById("dob-year").value;

      if (!month || !day || !year) {
        showError("Please select a complete date of birth.");
        return;
      }

      localStorage.setItem("arcadia_user", JSON.stringify({ username: username }));
      alert(`Account created! Welcome to Arcadia, ${username}!`);
    });
  </script>

</body>
</html>
