<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcadia - Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #191919 url('background.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .brand-logo {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    .brand-logo img {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
    }

    /* Selection Screen Header & Alignment */
    #selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .account-title {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .account-title img {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
    }

    /* Larger Square Image Buttons */
    .selection-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .square-btn {
      width: 260px;
      height: 260px;
      background-color: #232527;
      border: 1px solid #393b3d;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .square-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Auth Form Card */
    .auth-card {
      background: #232527;
      border: 1px solid #393b3d;
      border-radius: 4px;
      width: 100%;
      max-width: 420px;
      padding: 30px;
    }

    .auth-card h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #111213;
      border: 1px solid #393b3d;
      color: #fff;
      border-radius: 3px;
      font-size: 14px;
      outline: none;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 12px;
    }

    .birthday-selects {
      display: flex;
      gap: 8px;
    }

    .btn-roblox {
      width: 100%;
      background: #00a2ff;
      border: none;
      color: #fff;
      padding: 12px;
      font-weight: 700;
      font-size: 15px;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-back {
      background: #393b3d;
      margin-top: 10px;
    }

    .error-msg {
      background: rgba(248, 43, 43, 0.15);
      border: 1px solid #f82b2b;
      color: #ff6b6b;
      padding: 8px 12px;
      border-radius: 3px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="brand-logo">
    <img src="arcadia.png" alt="ARCADIA">
  </div>

  <div id="selection-screen">
    <div class="account-title">
      <img src="account.png" alt="Account">
    </div>

    <div class="selection-container">
      <div class="square-btn" onclick="openForm('login')">
        <img src="login.png" alt="Log In">
      </div>
      <div class="square-btn" onclick="openForm('signup')">
        <img src="signup.png" alt="Sign Up">
      </div>
    </div>
  </div>

  <div id="auth-card-container" class="auth-card hidden">
    <div id="error-box" class="error-msg"></div>

    <form id="login-form" class="hidden">
      <h2>Log In to Arcadia</h2>
      
      <div class="form-group">
        <label for="login-username">Username / Email</label>
        <input type="text" id="login-username" placeholder="Username" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('login-password', this)">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-roblox">Log In</button>
      <button type="button" class="btn-roblox btn-back" onclick="showSelectionScreen()">Back</button>
    </form>

    <form id="signup-form" class="hidden">
      <h2>Sign Up for Arcadia</h2>

      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="Don't use your real name" required minlength="3" maxlength="20">
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="signup-password" placeholder="At least 8 characters" required minlength="8">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('signup-password', this)">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label>Birthday</label>
        <div class="birthday-selects">
          <select id="dob-month" required>
            <option value="" disabled selected>Month</option>
            <option>Jan</option><option>Feb</option><option>Mar</option>
            <option>Apr</option><option>May</option><option>Jun</option>
            <option>Jul</option><option>Aug</option><option>Sep</option>
            <option>Oct</option><option>Nov</option><option>Dec</option>
          </select>
          <select id="dob-day" required>
            <option value="" disabled selected>Day</option>
          </select>
          <select id="dob-year" required>
            <option value="" disabled selected>Year</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Gender (Optional)</label>
        <select id="signup-gender">
          <option value="unspecified">Unspecified</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </div>

      <button type="submit" class="btn-roblox">Sign Up</button>
      <button type="button" class="btn-roblox btn-back" onclick="showSelectionScreen()">Back</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const daySelect = document.getElementById("dob-day");
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        daySelect.appendChild(opt);
      }

      const yearSelect = document.getElementById("dob-year");
      const currentYear = new Date().getFullYear();
      for (let i = currentYear; i >= 1920; i--) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = i;
        yearSelect.appendChild(opt);
      }
    });

    function openForm(mode) {
      document.getElementById("selection-screen").classList.add("hidden");
      document.getElementById("auth-card-container").classList.remove("hidden");
      document.getElementById("error-box").style.display = "none";

      if (mode === 'login') {
        document.getElementById("login-form").classList.remove("hidden");
        document.getElementById("signup-form").classList.add("hidden");
      } else {
        document.getElementById("signup-form").classList.remove("hidden");
        document.getElementById("login-form").classList.add("hidden");
      }
    }

    function showSelectionScreen() {
      document.getElementById("auth-card-container").classList.add("hidden");
      document.getElementById("login-form").classList.add("hidden");
      document.getElementById("signup-form").classList.add("hidden");
      document.getElementById("selection-screen").classList.remove("hidden");
    }

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btnEl.innerText = "Hide";
      } else {
        input.type = "password";
        btnEl.innerText = "Show";
      }
    }

    function showError(message) {
      const errorBox = document.getElementById("error-box");
      errorBox.innerText = message;
      errorBox.style.display = "block";
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      if (!username || !password) {
        showError("Please enter both username and password.");
        return;
      }

      localStorage.setItem("arcadia_user", JSON.stringify({ username: username }));
      alert(`Logged in successfully as ${username}!`);
    });

    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("signup-username").value.trim();
      const password = document.getElementById("signup-password").value;
      const month = document.getElementById("dob-month").value;
      const day = document.getElementById("dob-day").value;
      const year = document.getElementById("dob-year").value;

      if (!month || !day || !year) {
        showError("Please select a complete date of birth.");
        return;
      }

      localStorage.setItem("arcadia_user", JSON.stringify({ username: username }));
      alert(`Account created! Welcome to Arcadia, ${username}!`);
    });
  </script>

</body>
</html>
